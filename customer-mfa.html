
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Multi-Factor Authentication</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="mfa-container">
        <h1>Customer Security Verification</h1>

        <p id="statusText">Checking your account...</p>

        <section id="setupInstructions" hidden>
            <h2>Set Up Your Authenticator</h2>
            <p>
                Scan this QR code using Google Authenticator.
            </p>

            <div>
                <img id="qrCode" alt="Authenticator setup QR code">
            </div>

            <p>
                After scanning, enter the six-digit code
                generated by your authenticator app.
            </p>
        </section>

        <section id="verificationSection" hidden>
            <label for="verificationCode">
                Six-digit verification code
            </label>

            <input
                type="text"
                id="verificationCode"
                inputmode="numeric"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="Enter 6-digit code"
            >

            <button type="button" id="verifyButton">
                Verify and Continue
            </button>
        </section>

        <p id="message" role="status"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="customer-mfa.js"></script>

</body>
</html>
